name: Settle funds

on:
  schedule:
    # Every 2 days at 12:00 UTC (1st, 3rd, 5th, … of each month)
    - cron: "0 12 */2 * *"
  workflow_dispatch:

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Settle claimed funds
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET repository secrets are required."
            exit 1
          fi

          response=$(curl -sf \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/settle")

          echo "$response" | jq .
